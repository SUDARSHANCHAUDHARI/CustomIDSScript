[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customidsscript"
version = "1.0.0"
description = "Simple Linux log IDS that evaluates local rules and emits terminal, Markdown, and JSON alerts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
custom-ids = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ids*"]
